<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="64mm" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Overview of the WarrantRoute framework</title>
  <desc id="desc">Source text becomes natural or controlled evidence packets. Researchers provide three artifact-quality ratings and other initial signals, and WarrantRoute assigns no specialist, a methods expert, a domain expert, or both under a fixed time budget. A held out test measures artifact quality, routing, and feedback repair.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344454"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65717d"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", Times, serif; fill: #17212b; }
      .stage-title { font-size: 31px; font-weight: 700; }
      .stage-number { font-size: 31px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .body { font-size: 31px; }
      .body-bold { font-size: 31px; font-weight: 700; }
      .router-title { font-size: 35px; font-weight: 700; fill: #004f7c; }
      .ribbon { font-size: 30px; font-weight: 700; }
      .guardrail { font-size: 30px; }
      .center { text-anchor: middle; }
      .card { fill: #ffffff; stroke: #8a949e; stroke-width: 2.2; }
      .card-header { fill: #f2f4f6; }
      .artifact { fill: #f7f8f9; stroke: #6f7a84; stroke-width: 2.2; }
      .human { fill: #fff4e8; stroke: #c65300; stroke-width: 2.5; }
      .system { fill: #e8f3fa; stroke: #0072b2; stroke-width: 2.5; }
      .outcome { fill: #e9f6f0; stroke: #008b68; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #344454; stroke-width: 3.5; marker-end: url(#arrow); }
      .small-arrow { fill: none; stroke: #65717d; stroke-width: 2.6; marker-end: url(#arrow-small); }
    </style>
  </defs>

  <!-- Development and evaluation protocol -->
  <rect x="30" y="15" width="1540" height="60" rx="14" fill="#f1f5f8" stroke="#8a949e" stroke-width="2.2"/>
  <rect x="48" y="26" width="370" height="38" rx="9" fill="#ffffff" stroke="#6f7a84" stroke-width="2"/>
  <text x="233" y="53" class="ribbon center">DEVELOP  |  Dreaddit train</text>
  <path d="M 430 45 H 492" class="small-arrow"/>
  <rect x="505" y="26" width="340" height="38" rx="9" fill="#e8f3fa" stroke="#0072b2" stroke-width="2"/>
  <text x="675" y="53" class="ribbon center">FIT + FREEZE</text>
  <path d="M 857 45 H 919" class="small-arrow"/>
  <rect x="932" y="26" width="620" height="38" rx="9" fill="#e9f6f0" stroke="#008b68" stroke-width="2"/>
  <text x="1242" y="53" class="ribbon center">TEST  |  held out CaCHe + Dreaddit audit</text>

  <!-- Stage 1 -->
  <rect x="30" y="95" width="285" height="400" rx="16" class="card"/>
  <path d="M 46 95 H 299 A 16 16 0 0 1 315 111 V 169 H 30 V 111 A 16 16 0 0 1 46 95 Z" class="card-header"/>
  <circle cx="61" cy="126" r="21" fill="#6f7a84"/>
  <text x="61" y="127" class="stage-number">1</text>
  <text x="88" y="124" class="stage-title">Construct</text>
  <text x="88" y="153" class="stage-title">packets</text>

  <rect x="50" y="184" width="245" height="58" rx="10" class="artifact"/>
  <text x="172.5" y="220" class="body center">Source text</text>
  <path d="M 172.5 243 V 258" class="small-arrow"/>
  <rect x="50" y="262" width="245" height="60" rx="10" class="system"/>
  <text x="172.5" y="299" class="body center">LLM interpretation</text>
  <path d="M 172.5 323 V 338" class="small-arrow"/>
  <rect x="50" y="342" width="245" height="66" rx="10" fill="#fff8ef" stroke="#c65300" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="172.5" y="368" class="body center">Natural outputs</text>
  <text x="172.5" y="397" class="body center">Controlled variants</text>
  <path d="M 172.5 409 V 424" class="small-arrow"/>
  <rect x="50" y="428" width="245" height="54" rx="10" class="artifact"/>
  <text x="172.5" y="451" class="body-bold center">Theme + evidence</text>
  <text x="172.5" y="476" class="body center">packet</text>

  <!-- Stage 2 -->
  <rect x="350" y="95" width="310" height="400" rx="16" class="card"/>
  <path d="M 366 95 H 644 A 16 16 0 0 1 660 111 V 169 H 350 V 111 A 16 16 0 0 1 366 95 Z" fill="#fff4e8"/>
  <circle cx="381" cy="126" r="21" fill="#c65300"/>
  <text x="381" y="127" class="stage-number">2</text>
  <text x="408" y="137" class="stage-title">First review</text>

  <rect x="373" y="184" width="264" height="58" rx="11" class="human"/>
  <text x="505" y="222" class="body-bold center">Researchers</text>
  <text x="505" y="284" class="body-bold center">Initial signals</text>
  <circle cx="386" cy="323" r="4.5" fill="#c65300"/>
  <text x="400" y="333" class="body">3 quality ratings</text>
  <circle cx="386" cy="369" r="4.5" fill="#c65300"/>
  <text x="400" y="379" class="body">Uncertainty</text>
  <circle cx="386" cy="415" r="4.5" fill="#c65300"/>
  <text x="400" y="425" class="body">Expert request</text>
  <circle cx="386" cy="461" r="4.5" fill="#c65300"/>
  <text x="400" y="471" class="body">Time + provenance</text>

  <!-- Stage 3 -->
  <rect x="695" y="95" width="245" height="400" rx="16" class="card"/>
  <path d="M 711 95 H 924 A 16 16 0 0 1 940 111 V 169 H 695 V 111 A 16 16 0 0 1 711 95 Z" fill="#e8f3fa"/>
  <circle cx="726" cy="126" r="21" fill="#0072b2"/>
  <text x="726" y="127" class="stage-number">3</text>
  <text x="753" y="137" class="stage-title">Route</text>

  <rect x="706" y="184" width="223" height="232" rx="14" class="system"/>
  <text x="817.5" y="225" class="router-title center">WarrantRoute</text>
  <text x="817.5" y="275" class="body-bold center">Interpretable</text>
  <text x="817.5" y="307" class="body-bold center">model</text>
  <line x1="742" y1="327" x2="893" y2="327" stroke="#0072b2" stroke-width="2"/>
  <text x="817.5" y="362" class="body center">Escalate?</text>
  <text x="817.5" y="398" class="body center">Which expert?</text>
  <rect x="706" y="426" width="223" height="57" rx="10" fill="#ffffff" stroke="#0072b2" stroke-width="2.2"/>
  <text x="817.5" y="451" class="body-bold center">Expert time</text>
  <text x="817.5" y="478" class="body-bold center">budget</text>

  <!-- Stage 4 -->
  <rect x="975" y="95" width="270" height="400" rx="16" class="card"/>
  <path d="M 991 95 H 1229 A 16 16 0 0 1 1245 111 V 169 H 975 V 111 A 16 16 0 0 1 991 95 Z" fill="#fff4e8"/>
  <circle cx="1006" cy="126" r="21" fill="#c65300"/>
  <text x="1006" y="127" class="stage-number">4</text>
  <text x="1033" y="124" class="stage-title">Allocate</text>
  <text x="1033" y="153" class="stage-title">review</text>

  <rect x="997" y="184" width="226" height="58" rx="10" class="artifact"/>
  <text x="1110" y="222" class="body-bold center">No specialist</text>
  <rect x="997" y="258" width="226" height="58" rx="10" class="human"/>
  <text x="1110" y="296" class="body-bold center">Methods expert</text>
  <rect x="997" y="332" width="226" height="58" rx="10" class="human"/>
  <text x="1110" y="370" class="body-bold center">Domain expert</text>
  <rect x="997" y="406" width="226" height="58" rx="10" class="human"/>
  <text x="1110" y="444" class="body-bold center">Both experts</text>

  <!-- Stage 5 -->
  <rect x="1280" y="95" width="290" height="400" rx="16" class="card"/>
  <path d="M 1296 95 H 1554 A 16 16 0 0 1 1570 111 V 169 H 1280 V 111 A 16 16 0 0 1 1296 95 Z" fill="#e9f6f0"/>
  <circle cx="1311" cy="126" r="21" fill="#008b68"/>
  <text x="1311" y="127" class="stage-number">5</text>
  <text x="1338" y="124" class="stage-title">Evaluate</text>
  <text x="1338" y="153" class="stage-title">+ repair</text>

  <text x="1304" y="202" class="body-bold">Outcomes</text>
  <circle cx="1308" cy="225" r="4.5" fill="#008b68"/>
  <text x="1322" y="234" class="body">Artifact quality</text>
  <circle cx="1308" cy="255" r="4.5" fill="#008b68"/>
  <text x="1322" y="264" class="body">Serious error recall</text>
  <circle cx="1308" cy="285" r="4.5" fill="#008b68"/>
  <text x="1322" y="294" class="body">False acceptance</text>
  <circle cx="1308" cy="315" r="4.5" fill="#008b68"/>
  <text x="1322" y="324" class="body">Min./correct error</text>

  <rect x="1292" y="351" width="266" height="130" rx="11" fill="#f8fcfa" stroke="#008b68" stroke-width="2.3" stroke-dasharray="7 5"/>
  <text x="1425" y="381" class="body-bold center">Repair test</text>
  <text x="1425" y="407" class="body center">Selected feedback</text>
  <path d="M 1425 411 V 421" class="small-arrow"/>
  <text x="1425" y="442" class="body center">Revision model</text>
  <path d="M 1425 446 V 455" class="small-arrow"/>
  <text x="1425" y="475" class="body center">Blinded panel</text>

  <!-- Main stage arrows -->
  <path d="M 315 295 H 340" class="arrow"/>
  <path d="M 660 295 H 685" class="arrow"/>
  <path d="M 940 295 H 965" class="arrow"/>
  <path d="M 1245 295 H 1270" class="arrow"/>

  <!-- Guardrails -->
  <rect x="30" y="520" width="1540" height="100" rx="14" fill="#fffaf3" stroke="#b16a2c" stroke-width="2.2"/>
  <text x="55" y="555" class="body-bold">GUARDRAILS</text>
  <text x="280" y="555" class="guardrail">Initial signals only  |  matched expert time  |  no protected attributes or test outcomes</text>
  <text x="800" y="596" class="guardrail center">Keep individual judgments and plural or ambiguous cases visible.</text>
</svg>
