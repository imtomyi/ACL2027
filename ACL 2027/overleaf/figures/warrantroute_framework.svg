<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="60mm" viewBox="0 0 1205 450" role="img" aria-labelledby="title desc">
<title id="title">Overview of the WarrantRoute framework</title><desc id="desc">Three steps: create a theme and evidence packet, collect initial signals from researchers without specialist expertise, and route the packet to human or role-prompted LLM reviewers.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#425466"/></marker><style>
text{font-family:"Times New Roman",Times,serif;fill:#17212b}.t{font-size:34px;font-weight:700}.b{font-size:29px}.bb{font-size:29px;font-weight:700}.n{font-size:25px;fill:#44515e}.c{text-anchor:middle}.card{fill:#fff;stroke:#7f8b96;stroke-width:2.4}.ar{fill:none;stroke:#425466;stroke-width:4;marker-end:url(#a)}
</style></defs>

<!-- 1: packet -->
<rect x="25" y="25" width="335" height="400" rx="18" class="card"/><path d="M43 25h299a18 18 0 0118 18v64H25V43a18 18 0 0118-18" fill="#f1f3f5"/><circle cx="68" cy="66" r="25" fill="#66727d"/><text x="68" y="77" class="t c" fill="#fff">1</text><text x="105" y="77" class="t">Create packet</text>
<rect x="58" y="142" width="269" height="64" rx="11" fill="#f7f8f9" stroke="#7f8b96" stroke-width="2.2"/><text x="192.5" y="183" class="b c">Source text</text><path d="M192.5 207v32" class="ar"/>
<rect x="58" y="244" width="269" height="64" rx="11" fill="#e8f3fa" stroke="#0072b2" stroke-width="2.4"/><text x="192.5" y="285" class="b c">LLM interpretation</text><path d="M192.5 309v32" class="ar"/>
<rect x="58" y="346" width="269" height="64" rx="11" fill="#f7f8f9" stroke="#7f8b96" stroke-width="2.2"/><text x="192.5" y="373" class="bb c">Theme + evidence</text><text x="192.5" y="402" class="b c">packet</text><path d="M360 225h42" class="ar"/>

<!-- 2: initial signals -->
<rect x="410" y="25" width="335" height="400" rx="18" class="card"/><path d="M428 25h299a18 18 0 0118 18v64H410V43a18 18 0 0118-18" fill="#fff4e8"/><circle cx="453" cy="66" r="25" fill="#c65300"/><text x="453" y="77" class="t c" fill="#fff">2</text><text x="490" y="77" class="t">Initial review</text>
<text x="577.5" y="161" class="bb c">Researchers</text><line x1="462" y1="181" x2="693" y2="181" stroke="#c65300" stroke-width="2"/>
<circle cx="477" cy="224" r="5" fill="#c65300"/><text x="497" y="234" class="b">Rate packet quality</text><circle cx="477" cy="284" r="5" fill="#c65300"/><text x="497" y="294" class="b">Flag uncertainty</text><circle cx="477" cy="344" r="5" fill="#c65300"/><text x="497" y="354" class="b">Request expertise</text>
<text x="577.5" y="385" class="n c">Signals available before</text><text x="577.5" y="412" class="n c">routed review</text><path d="M745 225h42" class="ar"/>

<!-- 3: routing -->
<rect x="795" y="25" width="385" height="400" rx="18" class="card"/><path d="M813 25h349a18 18 0 0118 18v64H795V43a18 18 0 0118-18" fill="#e8f3fa"/><circle cx="838" cy="66" r="25" fill="#0072b2"/><text x="838" y="77" class="t c" fill="#fff">3</text><text x="875" y="77" class="t">Route review</text>
<text x="987.5" y="153" class="t c" fill="#005f91">WarrantRoute</text><text x="987.5" y="190" class="n c">interpretable policy</text>
<rect x="830" y="219" width="150" height="58" rx="10" fill="#f7f8f9" stroke="#7f8b96" stroke-width="2"/><text x="905" y="257" class="b c">None</text><rect x="995" y="219" width="150" height="58" rx="10" fill="#fff4e8" stroke="#c65300" stroke-width="2"/><text x="1070" y="257" class="b c">Methods</text>
<rect x="830" y="292" width="150" height="58" rx="10" fill="#fff4e8" stroke="#c65300" stroke-width="2"/><text x="905" y="330" class="b c">Domain</text><rect x="995" y="292" width="150" height="58" rx="10" fill="#fff4e8" stroke="#c65300" stroke-width="2"/><text x="1070" y="330" class="b c">Both</text>
<text x="987.5" y="375" class="bb c">Human or LLM role fillers</text><text x="987.5" y="400" class="n c" style="font-size:22px">No protected attributes</text><text x="987.5" y="421" class="n c" style="font-size:22px">or test outcomes</text>
</svg>
