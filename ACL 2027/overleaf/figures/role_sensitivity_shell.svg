<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="42mm" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Empty recall reporting template for RQ1 human review and RQ2 LLM review</title>
<desc id="desc">Two empty panels reserve space to report how often human reviewers and LLM reviewers using role prompts identify errors across five failure families. No observations, estimates, points, or intervals are shown.</desc>
<defs>
  <style>
    text{font-family:"Times New Roman",Times,serif;fill:#17212b}
    .panel{fill:#fff;stroke:#7f8b96;stroke-width:2.4}
    .plot{fill:#fafbfc;stroke:#9aa4ad;stroke-width:2;stroke-dasharray:10 8}
    .tag{font-size:29px;font-weight:700;fill:#fff;text-anchor:middle}
    .head{font-size:30px;font-weight:700}
    .sub{font-size:23px;fill:#44515e}
    .cat{font-size:22px;fill:#26323d;text-anchor:end}
    .axis{font-size:22px;font-weight:700;fill:#44515e;text-anchor:middle}
    .empty{font-size:28px;font-weight:700;fill:#66727d;text-anchor:middle;letter-spacing:1.2px}
    .note{font-size:21px;fill:#66727d;text-anchor:middle}
    .rule{stroke:#d5dbe0;stroke-width:1.5}
  </style>
</defs>

<!-- Panel A -->
<rect x="20" y="10" width="768" height="400" rx="16" class="panel"/>
<path d="M36 10h736a16 16 0 0116 16v58H20V26a16 16 0 0116-16" fill="#e8f3fa"/>
<circle cx="61" cy="47" r="23" fill="#0072b2"/><text x="61" y="57" class="tag">A</text>
<text x="101" y="58" class="head">RQ1: Human recall by reviewer group</text>
<text x="748" y="105" class="sub" text-anchor="end">Series after analysis: Researchers / Methods experts / Domain experts</text>

<text x="244" y="139" class="cat">Unsupported evidence</text>
<text x="244" y="181" class="cat">Source concentration</text>
<text x="244" y="223" class="cat">Counterevidence loss</text>
<text x="244" y="265" class="cat">Contextual flattening</text>
<text x="244" y="307" class="cat">Unsupported abstraction</text>
<rect x="264" y="113" width="490" height="218" rx="8" class="plot"/>
<line x1="264" y1="155" x2="754" y2="155" class="rule"/>
<line x1="264" y1="197" x2="754" y2="197" class="rule"/>
<line x1="264" y1="239" x2="754" y2="239" class="rule"/>
<line x1="264" y1="281" x2="754" y2="281" class="rule"/>
<text x="509" y="211" class="empty">RESULT NOT YET AVAILABLE</text>
<text x="509" y="242" class="note">No points or intervals are shown</text>
<text x="509" y="367" class="axis">Errors identified (%)</text>
<text x="509" y="397" class="note">Populate only from the frozen real-corpus export</text>

<!-- Panel B -->
<rect x="812" y="10" width="768" height="400" rx="16" class="panel"/>
<path d="M828 10h736a16 16 0 0116 16v58H812V26a16 16 0 0116-16" fill="#fff4e8"/>
<circle cx="853" cy="47" r="23" fill="#c65300"/><text x="853" y="57" class="tag">B</text>
<text x="893" y="58" class="head">RQ2: LLM recall by prompted role</text>
<text x="1540" y="105" class="sub" text-anchor="end">Series after analysis: Researchers / Methods experts / Domain experts</text>

<text x="1036" y="139" class="cat">Unsupported evidence</text>
<text x="1036" y="181" class="cat">Source concentration</text>
<text x="1036" y="223" class="cat">Counterevidence loss</text>
<text x="1036" y="265" class="cat">Contextual flattening</text>
<text x="1036" y="307" class="cat">Unsupported abstraction</text>
<rect x="1056" y="113" width="490" height="218" rx="8" class="plot"/>
<line x1="1056" y1="155" x2="1546" y2="155" class="rule"/>
<line x1="1056" y1="197" x2="1546" y2="197" class="rule"/>
<line x1="1056" y1="239" x2="1546" y2="239" class="rule"/>
<line x1="1056" y1="281" x2="1546" y2="281" class="rule"/>
<text x="1301" y="211" class="empty">RESULT NOT YET AVAILABLE</text>
<text x="1301" y="242" class="note">No points or intervals are shown</text>
<text x="1301" y="367" class="axis">Errors identified (%)</text>
<text x="1301" y="397" class="note">Populate only from the frozen real-corpus export</text>
</svg>
