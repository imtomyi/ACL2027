<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="52mm" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Empty histogram template for review time across the two adopted corpora</title>
<desc id="desc">Two empty panels reserve space for review-time histograms for CaCHe and Dreaddit. No observations, bars, distributions, or medians are shown.</desc>
<defs>
  <style>
    text{font-family:"Times New Roman",Times,serif;fill:#17212b}
    .head{font-size:31px;font-weight:700;text-anchor:middle}
    .sub{font-size:23px;fill:#44515e;text-anchor:middle}
    .panel{fill:#fff;stroke:#7f8b96;stroke-width:2.4}
    .barhead{font-size:25px;font-weight:700}
    .role{font-size:21px;fill:#44515e}
    .plot{fill:#fafbfc;stroke:#9aa4ad;stroke-width:2;stroke-dasharray:10 8}
    .empty{font-size:26px;font-weight:700;fill:#66727d;text-anchor:middle;letter-spacing:1px}
    .note{font-size:20px;fill:#66727d;text-anchor:middle}
    .axis{font-size:21px;font-weight:700;fill:#44515e;text-anchor:middle}
    .yaxis{font-size:22px;font-weight:700;fill:#44515e;text-anchor:middle}
  </style>
</defs>

<text x="800" y="42" class="head">Review-time distribution by adopted evaluation corpus</text>
<text x="800" y="76" class="sub">Empty reporting template - populate only after the corresponding authorized analysis has run</text>
<text x="26" y="300" class="yaxis" transform="rotate(-90 26 300)">Percentage of completed ratings</text>

<!-- CaCHe -->
<rect x="62" y="104" width="722" height="374" rx="16" class="panel"/>
<path d="M78 104h690a16 16 0 0116 16v65H62v-65a16 16 0 0116-16" fill="#e8f3fa"/>
<text x="91" y="145" class="barhead">CaCHe</text>
<text x="91" y="172" class="role">Cross-domain confirmatory evaluation</text>
<rect x="96" y="208" width="654" height="183" rx="8" class="plot"/>
<text x="423" y="283" class="empty">RESULT NOT YET AVAILABLE</text>
<text x="423" y="317" class="note">No histogram bars or medians are shown</text>
<text x="423" y="432" class="axis">Observed review minutes per completed packet</text>

<!-- Dreaddit -->
<rect x="816" y="104" width="722" height="374" rx="16" class="panel"/>
<path d="M832 104h690a16 16 0 0116 16v65H816v-65a16 16 0 0116-16" fill="#e9f6f0"/>
<text x="845" y="145" class="barhead">Dreaddit</text>
<text x="845" y="172" class="role">In-domain audit</text>
<rect x="850" y="208" width="654" height="183" rx="8" class="plot"/>
<text x="1177" y="283" class="empty">RESULT NOT YET AVAILABLE</text>
<text x="1177" y="317" class="note">No histogram bars or medians are shown</text>
<text x="1177" y="432" class="axis">Observed review minutes per completed packet</text>

<text x="800" y="510" class="sub">When populated, both panels use the same preregistered bins and separate reviewer-group distributions</text>
</svg>
