<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified Inventory</title>
<style>
:root{color-scheme:light;--ink:#273331;--muted:#596b67;--line:#dbe2df;--accent:#176b65}
*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}a{color:var(--accent);text-underline-offset:4px}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;line-height:1.3;margin:8px 0 0}header nav{display:flex;gap:20px;font-size:13px}.back{font-size:13px}main{max-width:1200px;margin:auto;padding:28px 32px 56px}.snapshot{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);gap:24px;padding:22px 0 26px}.total{border-top:3px solid var(--accent);padding-top:12px}.total:nth-child(2){border-color:#446ca0}.total:nth-child(3){border-color:#9a4f70}.total:nth-child(4){border-color:#718548}.total strong{display:block;font-size:30px;line-height:1.3;font-variant-numeric:tabular-nums}.total span{color:var(--muted);font-size:13px}section{margin-top:28px}h2{font-size:19px;margin:0 0 16px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{font-weight:700;color:var(--muted);font-size:12px;vertical-align:bottom}th:first-child,td:first-child{text-align:left}td:first-child{font-weight:600}th:first-child{min-width:135px}tbody tr:hover{background:#f6f9f7}td:not(:first-child){white-space:nowrap}.note{color:var(--muted);font-size:12px;margin:12px 0}.checks{margin:0;padding:0;list-style:none}.checks li{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px}.checks li:before{content:"✓";color:var(--accent);font-size:17px}.checks p{margin:0;max-width:95ch}.checks li:last-child{border-bottom:1px solid var(--line)}details{border-top:1px solid var(--line);margin-top:24px}summary{padding:18px 0;cursor:pointer;font-weight:650}.bank-table td:first-child{font:12px/1.7 ui-monospace,monospace;overflow-wrap:anywhere;min-width:260px}.bank-table{min-width:700px}footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:20px;font-size:13px}a:focus-visible,summary:focus-visible,.table-wrap:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}
@media(max-width:650px){header{padding:20px;align-items:start}header nav{flex-direction:column;gap:8px}main{padding:24px 20px 40px}.totals{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.total strong{font-size:27px}h1{font-size:22px}.dataset-table{min-width:650px}footer{flex-wrap:wrap}}
</style>
</head>
<body>
<header><div><a class="back" href="index.html#guide">&larr; Datasets</a><h1>Verified Inventory</h1></div><nav aria-label="Files"><a href="VERIFIED_INVENTORY.md" download>Download Markdown</a><a href="bank_inventory.csv" download>Bank CSV</a></nav></header>
<main>
<div id="snapshot" class="snapshot"></div>
<div id="totals" class="totals" aria-label="Stored inventory totals"></div>
<p id="count-note" class="note"></p>
<section aria-labelledby="dataset-title"><h2 id="dataset-title">Dataset counts</h2><div id="datasets" class="table-wrap" tabindex="0" role="region" aria-label="Dataset counts"></div></section>
<section aria-labelledby="checks-title"><h2 id="checks-title">Integrity checks</h2><ul id="checks" class="checks"></ul><p id="limits" class="note"></p></section>
<details id="banks"><summary>Stored packet banks <span id="bank-count"></span></summary><div id="bank-table" class="table-wrap" tabindex="0" role="region" aria-label="Stored packet bank counts"></div></details>
<details><summary>All observed records</summary><div id="all-records"></div></details>
<footer><a href="background.html">Full background</a><a href="index.html#packets">Packet explorer</a><a href="audit.json">Audit JSON</a></footer>
</main>
<div id="source" hidden>__INVENTORY_HTML__</div>
<script>
const source=document.getElementById('source');
if(source.textContent.trim()==='__INVENTORY_'+'HTML__')location.replace('inventory.html');
const tables=[...source.querySelectorAll('table')],paragraphs=[...source.querySelectorAll(':scope > p')];
const $=id=>document.getElementById(id);
if(tables.length===2){
 const [datasets,banks]=tables;
 const rows=[...datasets.tBodies[0].rows],bankRows=[...banks.tBodies[0].rows];
 const sum=(items,column)=>items.reduce((total,row)=>total+Number(row.cells[column].textContent.replaceAll(',','')),0);
 const metrics=[['Main packets',sum(rows,1)],['Main excerpts',sum(rows,2)],['Observed bank entries',sum(rows,5)],['Stored reviewer files',sum(bankRows,4)]];
 for(const [label,value] of metrics){const item=document.createElement('div');item.className='total';const count=document.createElement('strong'),caption=document.createElement('span');count.textContent=value.toLocaleString('en-US');caption.textContent=label;item.append(count,caption);$('totals').append(item);}
 datasets.className='dataset-table';banks.className='bank-table';$('datasets').append(datasets);$('bank-table').append(banks);$('bank-count').textContent='('+bankRows.length+')';
 for(const p of paragraphs){
  const text=p.textContent;
  if(text.startsWith('Snapshot:'))$('snapshot').append(p);
  else if(text.startsWith('Counts describe'))$('count-note').textContent=text;
  else if(text.startsWith('Total:'))$('all-records').append(p);
  else if(text.startsWith('These checks'))$('limits').textContent=text;
  else{const li=document.createElement('li');li.append(p);$('checks').append(li);}
 }
}
</script>
</body>
</html>
